<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Relay — Maquette navigable</title><style>
/* PRESENTATION */
</style><style>
html,body{height:auto;min-height:100%;overflow:auto}.prototype-bar{padding:16px 22px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;flex-wrap:wrap}.prototype-bar strong{font-size:15px}.prototype-bar small{color:var(--muted)}.prototype-layout{display:flex;gap:22px;padding:22px;align-items:start}.simulation-tools{flex:0 0 205px;background:white;border:1px solid var(--border);border-radius:12px;padding:18px;position:sticky;top:16px}.simulation-tools h2{font-size:14px;margin-bottom:10px}.simulation-tools p{font-size:11px;line-height:1.7;color:var(--muted);margin:10px 0}.simulation-tools button,.simulation-tools select{width:100%;margin:5px 0}.prototype-frame{min-width:0;flex:1}.prototype-frame .app-window{position:relative;inset:auto;width:100%;height:760px;min-width:680px;min-height:550px;max-width:1400px;resize:both;border:1px solid #d3dce9;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.prototype-caption{font-size:11px;color:var(--muted);margin:0 0 12px}.simulation-tools[hidden]+.prototype-frame{max-width:1500px;margin:auto}.prototype-bar .btn{font-size:11px}#sim-result{font-size:11px;line-height:1.7;color:#546784}@media(max-width:1050px){.prototype-layout{padding:14px;gap:14px}.simulation-tools{flex-basis:175px}.prototype-frame .app-window{min-width:600px}}
</style></head><body>
<header class="prototype-bar"><strong>Agent Relay · Maquette</strong><small>Données fictives · aucune connexion réelle · aucun changement de votre machine</small><button class="btn" id="toggle-tools">Afficher / masquer les outils</button></header>
<div class="prototype-layout"><aside class="simulation-tools"><h2>Simulation</h2><p>Ces outils sont extérieurs à l’application.</p><button class="btn" id="sim-reset">Réinitialiser</button><button class="btn" id="sim-update">Actualiser les données fictives</button><button class="btn" id="sim-auto">Actualisation continue : non</button><button class="btn" id="sim-conflict">Prochaine action : conflit</button><label for="sim-state">Observation simulée</label><select id="sim-state"><option value="declared">Déclarée</option><option value="ready">Vérifiée</option><option value="stale">Ancienne observation</option><option value="unsupported">Contrôle non disponible</option><option value="failed">Contrôle échoué</option></select><label for="sim-size">Taille de l’aperçu</label><select id="sim-size"><option value="1120">Confort</option><option value="816">Compact</option><option value="1400">Large</option></select><p>Ouvrez des diagnostics ou une saisie, puis actualisez : votre position doit rester stable.</p><output id="sim-result" aria-live="polite"></output></aside>
<div class="prototype-frame"><p class="prototype-caption">FENÊTRE DE L’APPLICATION · redimensionnable</p><section class="app-window"><div class="app-shell"><aside id="app-nav" class="app-nav" aria-label="Navigation de l’application"></aside><main class="app-main"><header id="app-topbar" class="app-topbar"></header><div id="app-content" class="app-scroll" tabindex="-1"></div><div id="detail-layer"></div></main></div></section></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><div id="app-modal"></div>
<script>// PRESENTATION
</script><script>// SIMULATION
</script><script>// CONTROLLER
</script></body></html>
