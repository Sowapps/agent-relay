<script>// Stateless UI primitives shared by the application preview and its simulation tools.
window.RelayComponents = (() => {
 const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pad=(value,width=2)=>String(value).padStart(width,'0');
 const parsedDate=value=>{
  if(typeof value!=='string'||!value)return null;
  const date=new Date(/^\d{4}-\d{2}-\d{2}$/.test(value)?value+'T00:00:00':value);
  return Number.isNaN(date.getTime())?null:date;
 };
 const formatDate=value=>{const date=parsedDate(value);return date?`${pad(date.getDate())}/${pad(date.getMonth()+1)}/${pad(date.getFullYear(),4)}`:'Date indisponible';};
 const formatTime=(value,seconds=false)=>{const date=parsedDate(value);return date?`${pad(date.getHours())}:${pad(date.getMinutes())}${seconds?':'+pad(date.getSeconds()):''}`:'Heure indisponible';};
 const formatDateTime=(value,seconds=false)=>`${formatDate(value)} · ${formatTime(value,seconds)}`;
 const paths={relay:'M4 8h16l-5-5M20 16H4l5 5',overview:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',activity:'M3 12h4l3-7 4 14 3-7h4',message:'M4 4h16v12H9l-5 4V4z',terminal:'m5 6 5 5-5 5M13 17h6',transfer:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4',arrow:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6',warning:'m12 3 10 18H2L12 3zm0 6v5m0 3h.01',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-8 4H2m20 0h-2M12 4V2m0 20v-2M6 6 4 4m16 16-2-2M6 18l-2 2M20 4l-2 2',close:'m6 6 12 12M6 18 18 6',clock:'M12 7v5l3 2M22 12a10 10 0 1 0-20 0 10 10 0 0 0 20 0',search:'M21 21l-5-5M18 10a8 8 0 1 0-16 0 8 8 0 0 0 16 0',copy:'M8 8h13v13H8zM16 4V2H2v14h2',archive:'M3 3h18v5H3zM5 8v13h14V8M9 12h6',folder:'M3 6h7l2 3h9v11H3V6z',plus:'M12 4v16M4 12h16',reset:'M4 10a8 8 0 1 1 1 8M4 3v7h7',server:'M3 3h18v7H3zM3 14h18v7H3zM7 6h.01M7 17h.01',pause:'M8 5v14M16 5v14',layers:'m12 2 10 6-10 6L2 8l10-6zM2 13l10 6 10-6M2 18l10 6 10-6',book:'M4 3h7v17H4zM13 3h7v17h-7z'};
 const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.activity}"/></svg>`;
 const labels={running:'En cours',completed:'Terminée',attention:'Autorisation attendue',blocked:'Bloquée',unknown:'Résultat incertain',failed:'Échec',ready:'Disponible',idle:'En veille',offline:'Indisponible',closed:'Fermée',pending:'En attente',created:'Créée',preparing:'Préparation',unverified:'Non vérifié',declared:'Déclaré',stale:'À actualiser',unsupported:'Non disponible',checking:'Vérification en cours'};
 const badge=state=>`<span class="badge ${escape(state)}"><i class="dot ${escape(state)}"></i>${labels[state]||escape(state)}</span>`;
 const button=(label,action,attrs='',cls='',symbol='')=>`<button class="btn ${cls}" data-action="${action}" ${attrs}>${symbol?icon(symbol):''}${label}</button>`;
 const iconButton=(label,action,symbol,attrs='')=>`<button class="icon-button" data-action="${escape(action)}" title="${escape(label)}" aria-label="${escape(label)}" ${attrs}>${icon(symbol)}</button>`;
 const empty=(title,text,symbol='activity')=>`<div class="empty">${icon(symbol)}<h3>${escape(title)}</h3><p>${escape(text)}</p></div>`;
 const facts=rows=>`<div class="card">${rows.map(([label,value])=>`<div class="fact-row"><span class="fact-label">${label}</span><strong>${value}</strong></div>`).join('')}</div>`;
 const pageTitle=(eyebrow,title,subtitle,actions='')=>`<div class="page-title"><div><div class="eyebrow">${eyebrow}</div><h1>${escape(title)}</h1><p>${escape(subtitle)}</p></div>${actions}</div>`;
 const detailShell=(label,title,body,footer='')=>`<div class="detail-backdrop" data-action="close-detail"></div><aside class="detail-panel" role="dialog" aria-modal="false" aria-label="${escape(label)}"><div class="detail-head"><div><small>${label}</small><h2>${escape(title)}</h2></div><button class="icon-button" data-action="close-detail" aria-label="Fermer le détail">${icon('close')}</button></div><div class="detail-body">${body}</div>${footer?`<div class="detail-footer">${footer}</div>`:''}</aside>`;

 const section=(title,intro='',level=2)=>`<header class="section-intro"><h${level}>${escape(title)}</h${level}>${intro?`<p>${escape(intro)}</p>`:''}</header>`;
 const tabs=(items,selected,action,label)=>`<div class="tabs" role="tablist" aria-label="${escape(label)}">${items.map(([id,text,count])=>`<button id="tab-${action}-${escape(id)}" role="tab" aria-controls="panel-${action}" tabindex="${id===selected?'0':'-1'}" aria-selected="${id===selected}" class="${id===selected?'active':''}" data-action="${action}" data-value="${escape(id)}">${escape(text)}${count?`<span title="${count} éléments chargés avant filtrage">${count}</span>`:''}</button>`).join('')}</div>`;
 const panel=(action,selected,body)=>`<section id="panel-${action}" role="tabpanel" aria-labelledby="tab-${action}-${escape(selected)}">${body}</section>`;
 const connectionFacts=connection=>`<span class="connection-facts"><span class="tag">${escape(connection?.kind||'Connexion non renseignée')}</span>${(connection?.facts||[]).map(f=>`<span><b>${escape(f.label)} :</b> ${escape(f.value)}</span>`).join(' ')||`<span>${escape(connection?.name||'Contexte non renseigné')}</span>`}</span>`;
 // Preserve identity and native browser interaction state; no library or full-page refresh.
 const key=node=>node.nodeType!==1?null:node.id||node.dataset.key||(node.tagName==='DETAILS'?'details:'+node.querySelector('summary')?.textContent:null)||(node.dataset.action?[node.tagName,node.dataset.action,node.dataset.id,node.dataset.project,node.dataset.value,node.dataset.view].join('|'):null);
 function reconcile(current,next){
  if(current.nodeType!==next.nodeType||current.nodeName!==next.nodeName){current.replaceWith(next.cloneNode(true));return;}
  if(current.nodeType!==1){if(current.nodeValue!==next.nodeValue)current.nodeValue=next.nodeValue;return;}
  for(const a of [...current.attributes])if(!next.hasAttribute(a.name)&&!(current.tagName==='DETAILS'&&a.name==='open'))current.removeAttribute(a.name);
  for(const a of next.attributes)if(current.getAttribute(a.name)!==a.value&&!(current.tagName==='DETAILS'&&a.name==='open'))current.setAttribute(a.name,a.value);
  const pool=[...current.childNodes],used=new Set();
  let cursor=current.firstChild;
  for(const child of [...next.childNodes]){
   const k=key(child);let match=k?pool.find(n=>!used.has(n)&&key(n)===k):pool.find(n=>!used.has(n)&&!key(n)&&n.nodeType===child.nodeType&&n.nodeName===child.nodeName);
   if(!match){match=child.cloneNode(true);current.insertBefore(match,cursor);}else{used.add(match);if(match!==cursor)current.insertBefore(match,cursor);reconcile(match,child);}
   cursor=match.nextSibling;
  }
  for(const n of pool)if(!used.has(n)&&n.parentNode===current)current.removeChild(n);
  if(current instanceof HTMLInputElement&&current!==document.activeElement){if(current.type==='checkbox')current.checked=next.checked;else if(current.value!==next.value)current.value=next.value;}
  if(current instanceof HTMLSelectElement&&current!==document.activeElement)current.value=next.value;
 }
 function patch(element,html,reset=false){const template=document.createElement('template');template.innerHTML=html;if(reset){element.replaceChildren(template.content.cloneNode(true));return;}const shell=element.cloneNode(false);shell.append(template.content);reconcile(element,shell);}
 return {escape,icon,badge,button,iconButton,empty,facts,pageTitle,detailShell,formatDate,formatTime,formatDateTime,section,tabs,panel,connectionFacts,patch};
})();

// Pure presentation helpers: identities, capabilities, task aggregates and shared filters.
window.RelayModel = (() => {
 const attentionStates=['unknown','blocked','attention','failed'];
 const needsAttention=item=>attentionStates.includes(item.state)&&!item.reviewed;
 const participant=(data,id)=>data.participants.find(p=>p.id===id);
 const session=(data,id)=>data.sessions.find(s=>s.id===id);
 const connector=(data,sessionId)=>data.connectors.find(c=>c.id===participant(data,session(data,sessionId)?.participantId)?.connectorId);
 const connection=(data,sessionId)=>data.connections.find(c=>c.id===participant(data,session(data,sessionId)?.participantId)?.connectionId);
 const can=(data,sessionId,capability)=>data.projects.find(p=>p.id===session(data,sessionId)?.project)?.state!=='archived'&&(!data.projects.find(p=>p.id===session(data,sessionId)?.project)?.archiveRequested||['operations.interrupt','sessions.inspect'].includes(capability))&&Boolean((session(data,sessionId)?.capabilities||connector(data,sessionId)?.capabilities||[]).includes(capability));
 const actor=(data,item)=>participant(data,item.participantId||item.senderId)?.name||'Participant inconnu';
 const sessionState=(data,s)=>s.state==='closed'?'closed':data.operations.some(o=>o.session===s.id&&o.state==='running')?'running':s.state||'unknown';
 const taskState=(data,id)=>{
  const ops=data.operations.filter(o=>o.taskId===id);
  return [...attentionStates,'running','pending'].find(state=>ops.some(o=>o.state===state))||(ops.length?'completed':'idle');
 };
 const timeline=(data,taskId)=>[
  ...data.operations.filter(o=>o.taskId===taskId).map(o=>({...o,eventType:'operation'})),
  ...data.messages.filter(m=>m.taskId===taskId).map(m=>({...m,eventType:'message'}))
 ].sort((a,b)=>a.stamp.localeCompare(b.stamp)||(a.eventType===b.eventType?0:a.eventType==='operation'?-1:1)||a.id.localeCompare(b.id));
 const sessionEntries=(data,id)=>{
  const current=session(data,id);if(!current)return [];
  const operations=data.operations.filter(item=>item.project===current.project&&item.session===id),messages=data.messages.filter(item=>item.project===current.project&&item.session===id);
  const entries=operations.flatMap(operation=>{
   const rows=[{...operation,eventType:'request',entryId:'request:'+operation.id,text:operation.request||operation.title}];
   if((operation.hasResult||operation.hasResult===undefined&&operation.result||attentionStates.includes(operation.state))&&!messages.some(message=>message.operation===operation.id&&message.kind==='reply'))
    rows.push({...operation,eventType:'result',entryId:'result:'+operation.id,stamp:operation.updatedAt||operation.stamp,text:operation.result||'Résultat non confirmé.'});
   return rows;
  });
  entries.push(...messages.map(message=>({...message,eventType:'message',entryId:'message:'+message.id})));
  const order={request:0,message:1,result:2};
  return entries.sort((a,b)=>a.stamp.localeCompare(b.stamp)||order[a.eventType]-order[b.eventType]||a.entryId.localeCompare(b.entryId));
 };
 const sessionItem=(data,item)=>{const entries=sessionEntries(data,item.id);return {...item,title:item.name,description:item.workspace,initiatorId:item.ownerId,stamp:entries.at(-1)?.stamp||null,state:sessionState(data,item)};};
 const matches=(data,item,filters)=>{
  const ownProject=!filters.project||item.project===filters.project;
  const involved=[item.participantId,item.senderId,item.recipientId,item.initiatorId].filter(Boolean);
  const ownParticipant=!filters.participant||involved.includes(filters.participant);
  const age=item.stamp?(Date.parse(data.referenceDate+'T00:00:00Z')-Date.parse(item.stamp.slice(0,10)+'T00:00:00Z'))/86400000:NaN;
  const period=filters.period==='all'||(age>=0&&(filters.period==='week'?age<7:age===0));
  const state=item.state||'completed';
  const quick=filters.filter==='all'||filters.filter==='follow'&&needsAttention(item)||filters.filter==='running'&&['running','pending'].includes(state);
  const kind=!filters.kind||item.kind===filters.kind;
  const preciseState=!filters.state||state===filters.state;
  const text=[item.title,item.text,item.description,item.result,actor(data,item)].filter(Boolean).join(' ').toLocaleLowerCase('fr');
  return ownProject&&ownParticipant&&period&&quick&&kind&&preciseState&&(!filters.query||text.includes(filters.query.toLocaleLowerCase('fr')));
 };
 const taskMatches=(data,task,filters)=>{
  if(filters.project&&task.project!==filters.project)return false;
  const entries=timeline(data,task.id);
  const summary={...task,stamp:entries.at(-1)?.stamp||data.referenceDate+'T00:00:00',state:taskState(data,task.id),participantId:task.participantId,description:task.description};
  const broad={...filters,query:'',filter:'all',state:''};
  const context=entries.length?entries.some(item=>matches(data,item,broad)):matches(data,summary,broad);
  const state=summary.state;
  const stateMatch=(filters.filter==='all'||filters.filter==='follow'&&entries.some(item=>item.eventType==='operation'&&needsAttention(item))||filters.filter==='running'&&entries.some(item=>['running','pending'].includes(item.state)))&&(!filters.state||filters.state===state);
  const text=!filters.query||(task.title+' '+task.description).toLocaleLowerCase('fr').includes(filters.query.toLocaleLowerCase('fr'))||entries.some(item=>matches(data,item,{...filters,filter:'all',state:''}));
  return context&&stateMatch&&text;
 };
 return {attentionStates,needsAttention,participant,session,connector,connection,can,actor,sessionState,sessionEntries,sessionItem,taskState,timeline,matches,taskMatches};
})();

// Reusable history and task views, independent of provider and transport identities.
window.createRelayViews = (getData,getUI) => {
 const {escape:e,icon,badge,button:b,empty,detailShell}=window.RelayComponents;
 const M=window.RelayModel;
 const project=(data,id)=>data.projects.find(p=>p.id===id);
 const filterContext=ui=>({project:ui.project,participant:ui.participant,period:ui.period,filter:ui.filter,kind:ui.kind,state:ui.state,query:ui.query});
 const options=(items,selected)=>items.map(([v,label])=>`<option value="${e(v)}" ${selected===v?'selected':''}>${e(label)}</option>`).join('');
 const more=(type='tasks')=>{const data=getData(),ui=getUI(),scope=ui.project?project(data,ui.project):data;if(scope?.more)return type==='tasks'?scope.more.operations||scope.more.messages:!!scope.more[type];return scope?.hasMore??data.hasMore;};
 const activeFilters=()=>{const ui=getUI();return ui.period!=='all'||ui.filter!=='all'||ui.participant||ui.kind||ui.state||ui.query||ui.messageFilter&&ui.messageFilter!=='all';};
 function summary(type,total,matched,shown){const feminine=type!=='messages',suffix=(count)=>`${feminine?'e':''}${count>1?'s':''}`;return `<div class="history-count" role="status">${shown} affiché${suffix(shown)} · ${matched} correspondant${suffix(matched)} sur ${total} ${type==='tasks'?'tâches':type==='messages'?'messages':type==='sessions'?'sessions':'opérations'} chargé${suffix(total)}${more(type)?' · historique partiel, éléments précédents disponibles':' · historique chargé'}</div>`;}
 function emptyHistory(type){const filtered=activeFilters(),partial=more(type);return empty('Aucun élément '+(filtered?'correspondant':'enregistré'),filtered?'Les filtres actifs masquent les éléments : vérifiez la période, le participant, l’état ou la recherche.':partial?'Les éléments précédents ne sont pas tous chargés.':'Aucun élément n’est enregistré dans ce contexte.')+(filtered?`<div class="list-footer">${b('Effacer tous les filtres','clear-history','','quiet')}</div>`:'');}
 function pagination(type,matched){const ui=getUI();return matched>ui.limit||more(type)?`<div class="list-footer">${b('Charger plus','more',`data-kind="${type}"`,'quiet')}</div>`:'';}

 const dateLabel=(data,item)=>window.RelayComponents.formatDate(item.stamp);
 function controls(type='operations'){
  const data=getData(),ui=getUI(),participants=data.participants.filter(p=>!ui.project||project(data,ui.project).participantIds.includes(p.id));
  return `<div class="filter-bar">${type==='messages'?'<span class="muted">Recherche dans les messages</span>':`<div class="segmented" aria-label="État du suivi">${[['all','Tous les états'],['running','En cours'],['follow','À suivre']].map(([v,l])=>`<button data-action="filter" data-value="${v}" class="${ui.filter===v?'active':''}">${l}</button>`).join('')}</div>`}<label class="search-wrap">${icon('search')}<input id="activity-search" aria-label="Rechercher dans l’historique" placeholder="Rechercher dans l’historique…" value="${e(ui.query)}"></label></div><div class="history-controls"><label>Période<select aria-label="Période de l’historique" data-history="period">${options([['today','Aujourd’hui'],['week','7 derniers jours'],['all','Tout l’historique']],ui.period)}</select></label><label>Participant<select aria-label="Participant impliqué" data-history="participant">${options([['','Tous les participants'],...participants.map(p=>[p.id,p.name])],ui.participant)}</select></label>${type==='operations'||type==='tasks'?b(ui.advanced?'Moins de filtres':'Plus de filtres'+([ui.kind,ui.state].filter(Boolean).length?' · '+[ui.kind,ui.state].filter(Boolean).length:''),'advanced-filters','','quiet'):''}${activeFilters()?b('Effacer les filtres','clear-history','','quiet'):''}</div>${ui.advanced&&(type==='operations'||type==='tasks')?`<div class="history-advanced"><label>Type<select aria-label="Type d’opération" data-history="kind">${options([['','Tous les types'],['message','Échange'],['command','Commande'],['transfer','Transfert']],ui.kind)}</select></label><label>État précis<select aria-label="État précis" data-history="state">${options([['','Tous les états'],['running','En cours'],['attention','Autorisation attendue'],['blocked','Bloquée'],['unknown','Résultat incertain'],['failed','Échec'],['completed','Terminée']],ui.state)}</select></label>${b('Effacer les filtres','clear-history','','quiet')}</div>`:''}`;
 }
 function operationRow(op){
  const data=getData(),ui=getUI();
  const agent=op.kind==='command'?'Commande directe':M.actor(data,op);
  return `<button class="activity-row" data-action="operation" data-id="${op.id}" aria-label="Ouvrir : ${e(op.title)}"><span class="activity-symbol">${icon(op.kind==='message'?'message':op.kind==='transfer'?'transfer':'terminal')}</span><span><strong>${e(op.title)}</strong><small>${e(ui.project?agent:project(data,op.project).name+' · '+agent)}${op.reviewed?' · examiné':''}</small></span>${badge(op.state)}<time title="${window.RelayComponents.formatDateTime(op.stamp,true)}">${dateLabel(data,op)}</time>${icon('arrow')}</button>`;
 }
 function activity(ops,compact=false){
  const data=getData(),ui=getUI(),rows=ops.filter(o=>M.matches(data,o,filterContext(ui))).sort((a,b)=>b.stamp.localeCompare(a.stamp));
  return (compact?'':controls())+`<div class="card">${rows.length?rows.slice(0,compact?3:ui.limit).map(operationRow).join(''):emptyHistory('operations')}${compact?'':summary('operations',ops.length,rows.length,Math.min(rows.length,ui.limit))+pagination('operations',rows.length)}</div>`;
 }
 function taskList(compact=false){
  const data=getData(),ui=getUI();
  const stamp=task=>M.timeline(data,task.id).at(-1)?.stamp||data.referenceDate;
  const eligible=data.tasks.filter(t=>ui.project?t.project===ui.project:project(data,t.project)?.state!=='archived');
  const tasks=eligible.filter(t=>M.taskMatches(data,t,filterContext(ui))).sort((a,b)=>stamp(b).localeCompare(stamp(a)));
  return (compact?'':window.RelayComponents.section('Tâches','Suivre un même objectif et retrouver ses opérations et messages liés.')+controls('tasks'))+`<div class="card">${tasks.slice(0,compact?3:ui.limit).map(task=>{
   const entries=M.timeline(data,task.id),operations=entries.filter(x=>x.eventType==='operation').length,messages=entries.length-operations;
   return `<button class="activity-row task-row" data-action="task" data-id="${task.id}" aria-label="Tâche : ${e(task.title)}"><span class="activity-symbol">${icon('layers')}</span><span><strong>${e(task.title)}</strong><small>${!ui.project?e(project(data,task.project).name)+' · ':''}${operations} opération${operations>1?'s':''} · ${messages} message${messages>1?'s':''}</small></span>${badge(M.taskState(data,task.id))}<time>${entries.length?dateLabel(data,entries.at(-1)):''}</time>${icon('arrow')}</button>`;
  }).join('')||emptyHistory('tasks')}${compact?'':summary('tasks',eligible.length,tasks.length,Math.min(tasks.length,ui.limit))+pagination('tasks',tasks.length)}</div>`;
 }
 function taskDetail(id){
  const data=getData(),ui=getUI(),task=data.tasks.find(t=>t.id===id);if(!task)return '';

  else if(action==='close-mcp'){modal('Fermer cette connexion MCP ?',"<p>La requête engagée pourra se terminer. Aucun travail ne sera rejoué et les permissions restent conservées.</p><p>Le client peut nécessiter un rechargement explicite pour se reconnecter.</p>",C.button('Fermer la connexion','confirm-close-mcp',`data-id="${C.escape(id)}"`,'primary'));}
  else if(action==='confirm-close-mcp'){$('#app-modal').innerHTML='';host('close-mcp',{id});}
  else if(action==='settings-scope'){ui.settingScope=value;render();}
  else if(action==='project-settings'){const project=el.dataset.project||ui.project;if(project)navigate('project',project,'settings');}
  else if(action==='manage-projects'){navigate('settings');ui.settingScope='projects';render();}
  else if(action==='project-state'){
   const project=data.projects.find(p=>p.id===el.dataset.project);if(!project||ui.projectChange)return;
   const archived=project.state==='archived',pending=project.archiveRequested,state=archived||pending?'active':'archived';
   modal(pending?'Annuler l’archivage ?':archived?'Réactiver ce projet ?':'Archiver ce projet ?',`<p><strong>${C.escape(project.name)}</strong></p><p>${pending?'Les nouvelles actions seront de nouveau autorisées selon les permissions existantes. Aucun travail ne sera relancé.':archived?'Le projet réapparaîtra dans la navigation. Aucun travail ni aucune session ne sera relancé.':'Les nouvelles actions seront suspendues immédiatement. Le relais attendra la fin du travail engagé, puis archivera le projet automatiquement. Son historique et ses permissions seront conservés.'}</p>${archived||pending?'':'<p>Un résultat incertain ou une vérification impossible maintiendra la demande en attente avec un diagnostic. Aucune interruption ni approbation automatique. Vous pourrez annuler cette demande.</p>'}`,C.button(pending?'Annuler l’archivage':archived?'Réactiver':'Demander l’archivage','confirm-project-state',`data-project="${C.escape(project.id)}" data-value="${state}" data-expected="${archived?'archived':'active'}" data-pending="${Boolean(pending)}"`,'primary'));
  }
  else if(action==='confirm-project-state'){
   if(ui.projectChange)return;const current=data.projects.find(p=>p.id===el.dataset.project);if(!current||Boolean(current.archiveRequested)!==(el.dataset.pending==='true')||(current.state||'active')!==el.dataset.expected){modal('Le projet a changé','<p>Son état ou sa demande d’archivage a changé depuis votre ouverture. Actualisez avant de choisir une nouvelle action.</p>',C.button('Actualiser','project-state-refresh','','primary'));return;}ui.projectChange={project:el.dataset.project,state:value,expectedState:el.dataset.expected};$('#app-modal').innerHTML='';render();host('project-state',ui.projectChange);
  }
  else if(action==='project-state-refresh'){$('#app-modal').innerHTML='';host('refresh');}
  else if(action==='mark-reviewed'){const operation=data.operations.find(item=>item.id===id);if(operation)host('mark-reviewed',{id,project:operation.project,reviewToken:operation.reviewToken});}
  else if(action==='copy')host('copy',{text:messageText(el.dataset.type,id)});
  else if(action==='show-evidence'){const evidence=$('#operation-evidence');if(evidence){evidence.open=true;evidence.scrollIntoView({block:'nearest'});}}
  else if(action==='rename-session'){
   const session=data.sessions.find(s=>s.id===id);if(!session)return;
   modal('Renommer la session',`<label for="session-name">Nom de la session</label><input id="session-name" maxlength="120" value="${C.escape(session.name)}">`,C.button('Renommer','confirm-rename',`data-id="${C.escape(id)}"`,'primary'));
   $('#session-name').focus();
  }
  else if(action==='confirm-rename'){const name=$('#session-name').value.trim();if(name&&!ui.renamePending){ui.renamePending=true;host('session-control',{id,control:'rename:'+name});}}
  else if(action==='session-state'){const session=data.sessions.find(s=>s.id===id);if(session)host('session-control',{id,control:session.state==='closed'?'reopen':'close'});}
  else if(action==='interrupt')host('interrupt-operation',{id});
  else if(action==='inspect-session')host('inspect-session',{id});
  else if(['operation-events','inspect-partial'].includes(action))host(action,{id});
  else if(action==='close-modal')$('#app-modal').innerHTML='';
  else if(['refresh','open-console','edit-projects','legacy-history','quit'].includes(action))host(action);
 });
 document.addEventListener('input',event=>{
  if(event.target.id!=='activity-search')return;
  ui.query=event.target.value;render();
 });
 document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.history){ui[el.dataset.history]=el.value;ui.limit=5;render();}
  if(el.id==='compact-view'){document.body.classList.toggle('compact-rows',el.checked);try{localStorage.setItem('compact-rows',String(el.checked));}catch{} }
 });
 document.addEventListener('keydown',event=>{
  const tab=event.target.closest('[role=tab]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){const items=[...tab.closest('[role=tablist]').querySelectorAll('[role=tab]')],i=items.indexOf(tab),n=event.key==='Home'?0:event.key==='End'?items.length-1:(i+(event.key==='ArrowLeft'?-1:1)+items.length)%items.length;event.preventDefault();items[n].click();document.getElementById(items[n].id)?.focus();return;}
  if(event.key==='Tab'&&$('#app-modal').childElementCount){const fields=[...$('#app-modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),summary')];if(fields.length){const i=fields.indexOf(document.activeElement);if(event.shiftKey&&i<=0){event.preventDefault();fields.at(-1).focus();}else if(!event.shiftKey&&(i<0||i===fields.length-1)){event.preventDefault();fields[0].focus();}}}
  if(event.key==='Escape'){if($('#app-modal').childElementCount)$('#app-modal').innerHTML='';else{ui.detail=null;$('#detail-layer').innerHTML='';}}
 });
 function receive(message){
  if(!message||typeof message!=='object')return;
  if(message.type==='snapshot'){
   if(message.data?.schemaVersion!==1)return;
   const next=message.data;
   next.operations=next.operations.map(operation=>{const full=fullOperations.get(operation.id);return full&&full.updatedAt===operation.updatedAt&&full.state===operation.state?{...full,reviewed:operation.reviewed,reviewToken:operation.reviewToken}:operation;});
   for(const id of fullOperations.keys())if(!next.operations.some(operation=>operation.id===id))fullOperations.delete(id);
   if(ui.project&&!next.projects.some(p=>p.id===ui.project))Object.assign(ui,{view:'general',project:null,detail:null});
   if(ui.sessionId&&!next.sessions.some(session=>session.id===ui.sessionId))Object.assign(ui,{sessionId:null,tab:'sessions',detail:null});
   data=next;render();
  }else if(message.type==='startup-preference'){
   ui.startupPending=false;ui.startupError=message.data?.error||null;data.startup=message.data;data.startupEnabled=message.data?.enabled===true;render();if(ui.view==='settings'&&ui.settingScope==='general')$('#startup-switch')?.focus({preventScroll:true});
  }else if(message.type==='project-state'){
   ui.projectChange=null;const project=data?.projects.find(p=>p.id===message.project);if(project&&message.state){project.state=message.state;project.archiveRequested=Boolean(message.archiveRequested);}render();
   if(message.error)modal('Changement d’état non confirmé',`<p>${C.escape(message.error)}</p><p>Consultez l’état actuel avant de réessayer.</p>${message.diagnostic?`<details class="advanced"><summary>Détails techniques</summary><pre>${C.escape(message.diagnostic)}</pre></details>`:''}`,C.button('Actualiser','project-state-refresh','','primary'));
   else toast(message.archiveCancelled?'Archivage annulé. Les nouvelles actions sont de nouveau autorisées selon les permissions existantes.':message.archiveRequested?'Archivage demandé. Les nouveaux travaux sont suspendus pendant la fin du travail engagé.':message.state==='archived'?'Projet archivé. Son historique reste accessible dans Réglages → Projets.':'Projet réactivé. Aucun travail n’a été relancé.');
  }else if(message.type==='action-result'){
   ui.renamePending=false;if(message.success){$('#app-modal').innerHTML='';toast(message.text||'Action confirmée.');}else{const card=$('.app-modal-card');if(card){let alert=card.querySelector('[role=alert]');if(!alert){alert=document.createElement('p');alert.setAttribute('role','alert');card.insertBefore(alert,card.querySelector('.actions'));}alert.textContent=message.text;}else modal('Action non confirmée',`<p>${C.escape(message.text)}</p><p>Aucun nouvel essai automatique. Consultez l’état actuel avant de poursuivre.</p>` ,C.button('Actualiser','project-state-refresh','','primary'));}
  }else if(message.type==='operation'){
   const index=data?.operations.findIndex(o=>o.id===message.data?.id)??-1;
   if(index>=0){fullOperations.set(message.data.id,message.data);data.operations[index]=message.data;if(ui.detail?.type==='operation'&&ui.detail.id===message.data.id)renderDetail();}
  }else if(message.type==='operation-review'){const operation=data?.operations.find(item=>item.id===message.id&&item.reviewToken===message.reviewToken);if(operation){operation.reviewed=true;toast('Marqué comme examiné.',operation);const full=fullOperations.get(operation.id);if(full)full.reviewed=true;render();}}else if(message.type==='operation-diagnostic'){const operation=data?.operations.find(item=>item.id===message.id);if(operation){operation.diagnostic=message.text;if(ui.detail?.type==='operation'&&ui.detail.id===message.id)renderDetail();}}else if(message.type==='notice'&&!message.text?.startsWith('Marqué comme examiné.'))toast(message.text||'Action terminée.');
 }
 try{document.body.classList.toggle('compact-rows',localStorage.getItem('compact-rows')==='true');}catch{}
 if(window.chrome?.webview)window.chrome.webview.addEventListener('message',event=>receive(event.data));
 window.RelayUI={receive,route:parameters=>{
  Object.assign(ui,{generalFeed:parameters.feed||'tasks',advanced:false,messageFilter:'all'});
  if(parameters.project)navigate('project',parameters.project,parameters.tab||'summary');else if(parameters.view)navigate(parameters.view);else navigate('general');
  if(parameters.feed){ui.generalFeed=parameters.feed;render();}
  if(parameters.scope&&['general','projects','mcp'].includes(parameters.scope)){ui.settingScope=parameters.scope;render();}
  if(parameters.session){ui.sessionId=parameters.session;ui.tab='conversation';render();}
  if(parameters.detail)detail(parameters.detail,parameters.id);
 }};
 host('ready');
})();

</script></body></html>
